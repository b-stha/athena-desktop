[build-system]
requires = ["setuptools>=66"]
build-backend = "setuptools.build_meta"

[project]
name = "athena-windows-mcp"
version = "0.3.0"
description = "Windows application and power tools for Athena's Windows-MCP runtime"
requires-python = ">=3.14"
dependencies = ["windows-mcp==0.8.8", "fastmcp==4.1.5"]

[project.scripts]
athena-windows-mcp = "athena_windows_mcp:main"

[tool.setuptools.packages.find]
include = ["athena_windows_mcp*"]
